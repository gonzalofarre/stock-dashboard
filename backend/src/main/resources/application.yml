server:
  port: 8080

spring:
  application:
    name: stock-dashboard
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:stock_dashboard}
    username: ${DB_USER:stock_dashboard}
    password: ${DB_PASSWORD:stock_dashboard}
  jpa:
    hibernate:
      ddl-auto: update # fine for this stage of the project; switch to a real migration tool (Flyway/Liquibase) before production
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5183}
  email:
    # "console" (default) logs the verification code instead of emailing it —
    # switch to "smtp" once SMTP_* env vars above are set to a real provider.
    mode: ${EMAIL_MODE:console}
  jwt:
    # DEV-ONLY default so the app runs out of the box locally. This is a real
    # secret in any shared/production environment — always override via the
    # APP_JWT_SECRET env var there. (Base64-encoded, >= 256 bits for HS256.)
    secret: ${APP_JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi1jaGFuZ2UtbWU=}
    access-token-minutes: 15
    refresh-token-days: 30
  marketdata:
    # "mock" (default) fabricates plausible-looking fake quotes — fine for UI
    # development. Set to "twelvedata" once TWELVE_DATA_API_KEY is set below.
    provider: ${MARKETDATA_PROVIDER:mock}
    # 30 min default: generous for a dashboard that isn't a trading terminal,
    # and long enough that the ~50-ticker universe stays fully warm between
    # MarketDataCacheWarmer sweeps once max-stale-fetch-per-call is capped
    # down for a real, rate-limited provider (see below).
    cache-ttl-seconds: ${MARKETDATA_CACHE_TTL_SECONDS:1800}
    # How many stale tickers ONE call is allowed to fetch from the provider.
    # 100 (> our whole universe) is a no-op cap, fine for the mock provider.
    # Twelve Data's free tier caps at 8 API credits/minute *shared across
    # endpoints* (confirmed against a real key) — set this to 8 alongside
    # TWELVE_DATA_API_KEY so one request can never blow the whole minute's
    # budget; MarketDataCacheWarmer's scheduled sweeps fill in the rest.
    max-stale-fetch-per-call: ${MARKETDATA_MAX_STALE_FETCH:100}
    twelvedata:
      api-key: ${TWELVE_DATA_API_KEY:}
  earnings:
    # "mock" (default) fabricates a plausible-looking fake earnings calendar —
    # fine for UI development. Set to "fmp" once FMP_API_KEY is set below.
    provider: ${EARNINGS_PROVIDER:mock}
    fmp:
      api-key: ${FMP_API_KEY:}
  strategy:
    # "mock" (default) fabricates a deterministic fake intraday price series
    # per ticker — fine for UI development. Set to "twelvedata" once
    # TWELVE_DATA_API_KEY (above, under marketdata) is set; it's the same key.
    provider: ${STRATEGY_PROVIDER:mock}
    # Same reasoning as marketdata.cache-ttl-seconds / max-stale-fetch-per-call
    # above, just for the intraday bar series instead of quotes.
    cache-ttl-seconds: ${STRATEGY_CACHE_TTL_SECONDS:1800}
    max-stale-fetch-per-call: ${STRATEGY_MAX_STALE_FETCH:100}

---
# This whole document only activates once GOOGLE_CLIENT_ID is actually set —
# Spring Boot's OAuth2 client autoconfiguration eagerly validates that a
# registered provider's client-id is non-empty, so without this guard the
# app refuses to start at all until Google credentials exist. Keeping it
# conditional means "Login with Google" simply isn't offered until you add
# real credentials, instead of blocking local development before then.
spring:
  config:
    activate:
      on-property: GOOGLE_CLIENT_ID
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
